[project]
name = 'wambatic'
version = '0.1.0'
description = 'Visualisation and report of statistics from github.com for a user, a repo or an organisation.'
readme = 'AGENTS.md'
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "aiohttp>=3.14.5",
    "cappa>=0.33.0",
    "fastapi>=0.143.2",
    "loguru>=0.7.3",
    "plotly>=7.1.0",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
wambatic = 'wambatic.cli:run'

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.165.9",
    "mypy>=2.3.1",
    "playwright>=1.64.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ['uv_build>=0.11,<0.14']
build-backend = 'uv_build'

[tool.uv]
# A 14-day quarantine on every release, as a supply-chain measure: a package
# compromised at upload is usually found and yanked well inside that window.
# It is a rolling cutoff, so what a re-lock can reach moves with the clock.
exclude-newer = "14 days"
# uv's default is `if-necessary`, which adopts a pre-release whenever no stable
# release satisfies a constraint - quietly, with the beta landing in the
# committed lockfile as a resolver accident. Fail the resolution instead, so
# taking a pre-release has to be a recorded decision. Relax this to `explicit`
# and name the package if one is ever genuinely wanted.
prerelease = "disallow"

# no:
# - win32
# - intel macs
environments = [
    "sys_platform != 'win32' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
]


[tool.uv.build-backend]
module-name = 'wambatic'
module-root = 'src'

[tool.ruff]
extend-exclude = ['.agents', 'agents']
line-length = 100
src = ['src']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['ANN', 'B', 'E', 'F', 'I', 'UP']

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ['wambatic']

[tool.mypy]
strict = true
mypy_path = 'src'
explicit_package_bases = true

# plotly ships no py.typed and no stubs (checked on 7.1.0, 2026-10-30), and only
# wambatic.reports.html imports it, for the plotly.js it bundles.
[[tool.mypy.overrides]]
module = ['plotly', 'plotly.*']
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ['src/tests']
pythonpath = ['src']
markers = [
    'browser: opens a page in headless Chromium; skipped when no Chromium can be launched',
    'live: calls the real GitHub API; skipped without GITHUB_TOKEN',
    'slow: loads large models or processes real datasets',
]
