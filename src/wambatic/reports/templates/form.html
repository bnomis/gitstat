<!doctype html>
<html lang="en"$theme_attribute>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wambatic</title>
<style>
$style
</style>
<style>
form {
  display: grid;
  gap: 12px;
  max-width: 520px;
  margin: 16px 0;
}

label,
fieldset {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  border: 0;
}

label small {
  color: var(--ink-secondary);
}

input[type="text"] {
  padding: 6px 8px;
  border: 1px solid var(--grid);
  border-radius: 4px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
}

fieldset div {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

fieldset label {
  display: flex;
  align-items: center;
  gap: 4px;
}

button {
  justify-self: start;
  padding: 6px 16px;
  border: 1px solid var(--grid);
  border-radius: 4px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  cursor: pointer;
}
</style>
</head>
<body>
<header>
<h1>wambatic</h1>
<p class="range">Statistics from github.com for a user, an organisation or a repository.</p>
</header>
<main>
<form action="/report" method="get">
<label>Target
<input type="text" name="target" value="$target" required placeholder="org:NAME, user:NAME or repo:OWNER/NAME">
<small>user:NAME, org:NAME, repo:OWNER/NAME, OWNER/NAME or a bare NAME</small>
</label>
<fieldset>
<legend>Shown first</legend>
<div>
<label><input type="radio" name="by" value="year"> Year</label>
<label><input type="radio" name="by" value="month" checked> Month</label>
<label><input type="radio" name="by" value="week"> Week</label>
<label><input type="radio" name="by" value="day"> Day</label>
</div>
</fieldset>
<label>Since
<input type="text" name="since" placeholder="YYYY-MM-DD" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}">
</label>
<label>Until
<input type="text" name="until" placeholder="YYYY-MM-DD" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}">
</label>
<label>Groups
<input type="text" name="groups" placeholder="activity,flow">
<small>Comma-separated: activity, flow, delivery</small>
</label>
<label><span><input type="checkbox" name="by_author" value="1"> Break activity down by author</span></label>
<label>Time zone
<input type="text" name="tz" placeholder="UTC">
</label>
<button type="submit">Show report</button>
</form>
</main>
</body>
</html>
